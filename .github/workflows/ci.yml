name: Validation + Déploiement (Optimisé 2026)

permissions:
  contents: write
  pages: write
  id-token: write

on:
  push:
    branches:
      - main
      - gh-pages
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Ajouter bin au PATH
        run: echo "$PWD/bin" >> $GITHUB_PATH

      - name: Définir NOUVEAU_DOC_ROOT
        run: echo "NOUVEAU_DOC_ROOT=${{ github.workspace }}" >> $GITHUB_ENV

      - name: Installer jq
        run: sudo apt-get install -y jq

      - name: Rendre les scripts exécutables
        run: chmod +x validate_all_multi.sh

      - name: Debug nouveau_doc
        run: |
          which nouveau_doc
          nouveau_doc --help || true
          ls -R .
          ls -R rules
          ls -R rules_engine

      - name: Exécuter validate_all_multi.sh (rapport complet)
        id: validation
        env:
          NOUVEAU_DOC_ROOT: ${{ github.workspace }}
        run: ./validate_all_multi.sh --ci-report-all

      - name: Générer le badge global
        run: ./validate_all_multi.sh --ci-badge-auto

      - name: Générer les badges par type
        run: ./validate_all_multi.sh --ci-badges-per-type
        continue-on-error: true

      - name: Résumé Markdown
        if: always()
        run: |
          echo "## Résultats des tests" >> $GITHUB_STEP_SUMMARY
          if [ -f report.md ]; then
            cat report.md >> $GITHUB_STEP_SUMMARY
          else
            echo "**Aucun fichier report.md généré.**" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload des artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-validation
          path: |
            report.md
            report.json
            report.junit.xml
            tests_*.svg
            tests_badge.json
            tests_*.json
          if-no-files-found: warn

      - name: Vérifier le statut final
        if: steps.validation.outcome == 'failure'
        run: exit 1

  publish:
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download validation artifacts
        uses: actions/download-artifact@v4
        with:
          name: rapports-validation
          path: .

      - name: Préparer le dossier public
        run: |
          rm -rf public
          mkdir -p public

      - name: Copier les badges et JSON
        run: |
          cp tests_*.svg public/ || true
          cp tests_*.json public/ || true
          cp report.* public/ || true

      - name: Générer index.html
        run: ./generate_dashboard.sh

      - name: Déployer sur GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
